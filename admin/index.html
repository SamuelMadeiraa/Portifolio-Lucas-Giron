<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel — Lucas Giron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23FF3B00'/><text y='70' x='50' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='52' fill='%23fff'>LG</text></svg>">
</head>
<body>

<!-- ══ login ══ -->
<div class="login" id="login" hidden>
  <form class="login__card" id="loginForm">
    <div class="login__mark">LG</div>
    <div>
      <h1>Painel do site</h1>
      <p class="muted">Entre com a senha de administrador.</p>
    </div>
    <div class="notice" id="loginNotice" hidden></div>
    <label class="f">
      <span class="f__l">Senha</span>
      <input type="password" id="loginPw" autocomplete="current-password" required>
    </label>
    <button class="b b--primary b--block" type="submit" id="loginBtn">Entrar</button>
    <p class="login__err" id="loginErr" role="alert"></p>
  </form>
</div>

<!-- ══ app ══ -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side__brand"><span class="side__mark">LG</span><span>Painel</span></div>
    <nav class="side__nav" id="tabs"></nav>
    <div class="side__foot">
      <a class="b b--ghost b--sm" href="/" target="_blank" rel="noopener">Ver site ↗</a>
      <button class="b b--ghost b--sm" type="button" id="logoutBtn">Sair</button>
    </div>
  </aside>

  <main class="main">
    <header class="bar">
      <div class="bar__l">
        <h1 class="bar__t" id="tabTitle"></h1>
        <p class="bar__s" id="tabHint"></p>
      </div>
      <div class="bar__actions">
        <span class="dirty" id="dirty" hidden>● Alterações não publicadas</span>
        <button class="b b--ghost" type="button" id="discardBtn" hidden>Descartar</button>
        <button class="b b--ghost" type="button" id="previewBtn">Pré-visualizar</button>
        <button class="b b--primary" type="button" id="publishBtn">Publicar</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<dialog class="dlg" id="dlg"><div class="dlg__inner" id="dlgInner"></div></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/assets/js/content.js"></script>
<script src="/assets/js/schema.js"></script>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
